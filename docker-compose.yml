services:
  atlas-postgres:
    image: postgres:15-alpine
    container_name: atlas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env (ver scripts/generar-env.sh)}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Solo expuesto en la interfaz local (no en todas las interfaces de red)
      - "127.0.0.1:${PORT_POSTGRES:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BACKEND/sql/dump-atlas.sql:/tmp/dump-atlas.sql:ro
      - ./BACKEND/sql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network
    restart: unless-stopped

  atlas-backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: atlas-backend
    hostname: atlas-api
    environment:
      PORT: "4000"
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@atlas-postgres:5432/${POSTGRES_DB:-atlas}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Defina DATA_ENCRYPTION_KEY en .env}
      CORS_ORIGINS: http://localhost:${PORT_FRONTEND:-3350}
      PUBLIC_API_URL: http://localhost:${PORT_BACKEND:-4450}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS:-5}
      REGISTRO_MAX: ${REGISTRO_MAX:-30}
      TZ: America/Santiago
    ports:
      - "${PORT_BACKEND:-4450}:4000"
    depends_on:
      atlas-postgres:
        condition: service_healthy
    volumes:
      # Volumen nombrado: el contenedor sin privilegios (uid node) es dueño del storage de documentos
      - atlas_uploads:/app/uploads
    networks:
      - atlas-network
    restart: unless-stopped

  atlas-frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:${PORT_BACKEND:-4450}"
    container_name: atlas-frontend
    hostname: atlas-web
    environment:
      API_ORIGIN: "http://localhost:${PORT_BACKEND:-4450}"
    ports:
      - "${PORT_FRONTEND:-3350}:8080"
    depends_on:
      atlas-backend:
        condition: service_healthy
    networks:
      - atlas-network
    restart: unless-stopped

volumes:
  postgres_data:
  atlas_uploads:

networks:
  atlas-network:
    driver: bridge
    name: atlas-network
