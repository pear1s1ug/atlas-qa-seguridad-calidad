sonar.projectKey=atlas
sonar.projectName=Atlas - Sistema de Gestión
sonar.sources=BACKEND/src,FRONTEND/src,FRONTEND/templates
sonar.tests=BACKEND/tests
sonar.exclusions=**/node_modules/**,**/reports/**,**/*.svg,**/*.jpg
sonar.javascript.lcov.reportPaths=BACKEND/reports/coverage/lcov.info
sonar.sourceEncoding=UTF-8
# El frontend se valida con pruebas E2E (Playwright), no con cobertura de líneas
sonar.coverage.exclusions=FRONTEND/**,BACKEND/src/openapi.json
sonar.cpd.exclusions=BACKEND/src/openapi.json
